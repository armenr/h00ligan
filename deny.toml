# cargo-deny policy for the standalone h00ligan workspace.
# Vulnerabilities block; every exception names its live inclusion path and
# concrete removal condition.

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 backs regenerable code-intelligence graph records; remove when the record codec is replaced or the advisory is resolved" },
]
# Unmaintained crates are denied throughout the graph except for the exact live
# exception above. Unsoundness is denied for direct workspace dependencies.
unmaintained = "all"
unsound = "workspace"
yanked = "warn"

[licenses]
# ring's compound license (ISC + OpenSSL + SSLeay) is covered by
# ISC + OpenSSL on this allowlist.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDDL-1.0",
    "LicenseRef-BSL-1.1",    # h00ligan-engine and provider components
    "NCSA",                  # University of Illinois/NCSA, permissive (transitive)
    "0BSD",                  # BSD Zero Clause, maximally permissive
    "CDLA-Permissive-2.0",   # webpki root-cert DB data license, permissive
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
